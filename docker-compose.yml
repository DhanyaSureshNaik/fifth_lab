version: "3.8"

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - LOG_PATH=/app/model/training.log
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./logstash/pipeline.conf:/usr/share/logstash/pipeline/pipeline.conf:ro
      - ./model:/app/model
    command: logstash -f /usr/share/logstash/pipeline/pipeline.conf

  model:
    image: python:3.11-slim
    container_name: lr_model
    depends_on:
      kibana:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./model:/app/model
      - ./kibana:/app/kibana
      - ./requirements.txt:/app/requirements.txt
    command: >
      bash -c "
        pip install -r requirements.txt -q &&
        curl -sf -X POST http://kibana:5601/api/saved_objects/_import?overwrite=true
          -H 'kbn-xsrf: true'
          --form file=@/app/kibana/dashboard_export.ndjson &&
        python model/train.py
      "

volumes:
  es_data:
    driver: local
