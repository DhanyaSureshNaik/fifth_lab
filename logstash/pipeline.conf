# ---------------------------------------------------------------------------
# Logstash pipeline — ELK LR Logging
#
# Input  : reads JSON log lines from model/training.log
# Filter : parses JSON, casts numeric fields, adds derived metadata
# Output : Elasticsearch index + console (debug)
# ---------------------------------------------------------------------------

input {
  file {
    path            => "${LOG_PATH:/app/model/training.log}"
    start_position  => "beginning"
    sincedb_path    => "/dev/null"   # disable position tracking for dev
    codec           => "json"
  }
}

# ---------------------------------------------------------------------------
filter {
  # --- Rename core fields from pythonjsonlogger ---
  mutate {
    rename => {
      "asctime"    => "log_timestamp"
      "levelname"  => "log_level"
      "name"       => "logger_name"
    }
  }

  # --- Cast numeric fields that arrive as strings ---
  mutate {
    convert => {
      "n_total"       => "integer"
      "n_train"       => "integer"
      "n_test"        => "integer"
      "n_test_samples" => "integer"
      "duration_ms"   => "float"
      "r2_score"      => "float"
      "mse"           => "float"
      "rmse"          => "float"
      "scaler_mean"   => "float"
      "scaler_std"    => "float"
      "intercept"     => "float"
      "threshold"     => "float"
    }
  }

  # --- Parse ISO timestamp into @timestamp ---
  date {
    match       => ["log_timestamp", "yyyy-MM-dd'T'HH:mm:ss"]
    target      => "@timestamp"
    remove_field => ["log_timestamp"]
  }

  # --- Tag evaluation events for easy Kibana filtering ---
  if [stage] == "evaluation" {
    mutate { add_tag => ["evaluation"] }
  }

  if [stage] == "training" {
    mutate { add_tag => ["training"] }
  }

  # --- Drop internal Logstash bookkeeping fields ---
  mutate {
    remove_field => ["host", "path", "@version"]
  }
}

# ---------------------------------------------------------------------------
output {
  elasticsearch {
    hosts    => ["${ES_HOST:localhost}:${ES_PORT:9200}"]
    index    => "logstash-training-%{+YYYY.MM.dd}"
    # Uncomment if Elasticsearch security is enabled:
    # user     => "${ES_USER:elastic}"
    # password => "${ES_PASS:changeme}"
  }

  # Console output — useful for debugging; remove in production
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
